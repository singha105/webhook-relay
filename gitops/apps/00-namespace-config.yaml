# Sync waves.
#
# ArgoCD applies resources in ascending wave order and waits for each wave to
# report healthy before starting the next. Without them everything applies at
# once, and the api pods CrashLoopBackOff for a few minutes while Postgres
# starts — which looks like a broken deploy and trains people to ignore red.
#
# Wave -1: this file. Nothing but ordering scaffolding.
# Wave  0: infrastructure ArgoCD owns (secrets).
# Wave  1: the application.
#
# Postgres and Valkey are provisioned by Terraform, not ArgoCD, so they are
# already running before ArgoCD is even installed. The waves here order what
# ArgoCD itself manages; the Helm chart's own pre-upgrade migration hook
# handles the schema-before-code ordering inside wave 1.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitops-sync-waves
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/part-of: webhook-relay
data:
  README: |
    Wave -1  ordering scaffolding
    Wave  0  sealed secrets
    Wave  1  webhook-relay application
