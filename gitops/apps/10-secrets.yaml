apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: webhook-relay-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/singha105/webhook-relay.git
    targetRevision: main
    path: gitops/secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: webhook-relay
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # The namespace is created by Terraform with labels the NetworkPolicies
      # select on. Letting ArgoCD create it would produce an unlabelled
      # namespace and silently break every policy that references it.
      - CreateNamespace=false
      - ApplyOutOfSyncOnly=true
