# Local development stack.
#
# Named so the network is predictably "webhook-relay_default", which the
# migrate service and any ad-hoc container can attach to.
name: webhook-relay

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: webhook_relay
      POSTGRES_PASSWORD: webhook_relay
      POSTGRES_DB: webhook_relay
      # Faster, safer initdb for a throwaway local database.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      # Exposed so `make test` and psql can reach it from the host.
      # Host port is overridable: a developer machine very often already has a
      # local Postgres on 5432.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      # -U and -d are both required: without them pg_isready checks the
      # default "postgres" database, which reports ready before ours exists.
      test: ["CMD-SHELL", "pg_isready -U webhook_relay -d webhook_relay"]
      interval: 2s
      timeout: 3s
      retries: 15
      # Gives a cold start room to run initdb without burning retries.
      start_period: 10s
    restart: unless-stopped

  valkey:
    image: valkey/valkey:8-alpine
    # Day 1 does not use Valkey. It is here so the stack Day 2 needs comes up
    # from the same command, and so a broken image tag is discovered now.
    command: ["valkey-server", "--appendonly", "yes", "--save", ""]
    ports:
      - "${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 2s
      timeout: 3s
      retries: 15
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        TARGET: api
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://webhook_relay:webhook_relay@postgres:5432/webhook_relay?sslmode=disable"
      VALKEY_URL: "redis://valkey:6379"
      LOG_LEVEL: "info"
      OTLP_ENDPOINT: "otel-collector:4317"
      TRACING_ENABLED: "${TRACING_ENABLED:-true}"
      SERVICE_VERSION: "${SERVICE_VERSION:-day-3}"
      READINESS_MAX_BACKLOG_AGE: "${READINESS_MAX_BACKLOG_AGE:-2m}"
      DB_MAX_CONNS: "${DB_MAX_CONNS:-10}"
    ports:
      # 8080 collides with Apache, Tomcat, and half the tools on a dev laptop,
      # so the host side is overridable via API_PORT in .env.
      - "${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        # service_healthy, not service_started: the API pings Postgres at boot
        # and exits if it cannot connect, so starting it against a listening
        # but not-yet-ready Postgres would crash-loop it.
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      # The distroless image has no shell and no curl, so the binary probes
      # itself: `api -healthcheck` GETs its own /readyz and exits 0 or 1. That
      # also means the check cannot drift from the code it is checking.
      test: ["CMD", "/app", "-healthcheck"]
      interval: 5s
      timeout: 4s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Delivery worker: the outbox relay and the delivery pool in one process.
  # They are colocated because a deployment missing either is silently broken —
  # events enqueued and never delivered, or workers with nothing feeding them.
  worker:
    build:
      context: ../..
      dockerfile: Dockerfile
      args:
        TARGET: worker
    environment:
      DATABASE_URL: "postgres://webhook_relay:webhook_relay@postgres:5432/webhook_relay?sslmode=disable"
      VALKEY_URL: "redis://valkey:6379"
      LOG_LEVEL: "info"
      WORKER_CONCURRENCY: "${WORKER_CONCURRENCY:-10}"
      # Exposed so the load-test harness can vary it. The pool must exceed
      # WORKER_CONCURRENCY: the delivery goroutines and the outbox relay share
      # one pool, so a pool equal to the concurrency leaves the relay with
      # nothing and it blocks waiting for a connection a worker is holding.
      DB_MAX_CONNS: "${DB_MAX_CONNS:-10}"
      MAX_ATTEMPTS: "${MAX_ATTEMPTS:-6}"
      RETRY_BASE_DELAY: "${RETRY_BASE_DELAY:-1s}"
      RETRY_MAX_DELAY: "${RETRY_MAX_DELAY:-1h}"
      DELIVERY_TIMEOUT: "${DELIVERY_TIMEOUT:-10s}"
      # Exposed as an override because Day 5 turns it off on purpose to
      # demonstrate the duplicate deliveries it prevents.
      DELIVERY_DEDUP_ENABLED: "${DELIVERY_DEDUP_ENABLED:-true}"
      METRICS_ADDR: ":9100"
      OTLP_ENDPOINT: "otel-collector:4317"
      TRACING_ENABLED: "${TRACING_ENABLED:-true}"
      SERVICE_VERSION: "${SERVICE_VERSION:-day-3}"
      RATE_LIMIT_ENABLED: "${RATE_LIMIT_ENABLED:-true}"
      BREAKER_ENABLED: "${BREAKER_ENABLED:-true}"
      BREAKER_THRESHOLD: "${BREAKER_THRESHOLD:-10}"
      BREAKER_COOLDOWN: "${BREAKER_COOLDOWN:-5m}"
      DRAIN_TIMEOUT: "${DRAIN_TIMEOUT:-30s}"
    ports:
      - "${WORKER_METRICS_PORT:-9100}:9100"
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      # The worker serves no HTTP, so it checks what it actually needs: that
      # Postgres and Valkey are both reachable with its real configuration.
      test: ["CMD", "/app", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Observability. All OSS images, no accounts, no external services.
  #
  # Memory limits are set on every one of these because the stack has to fit
  # alongside Postgres, Valkey, the api and the worker on a laptop. An
  # unbounded Loki or Prometheus will happily take everything Docker will give
  # it and then the thing you were trying to observe gets OOM-killed instead.
  # ---------------------------------------------------------------------------

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.116.1
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ../observability/otel-collector.yaml:/etc/otel/config.yaml:ro
    ports:
      - "${OTLP_GRPC_PORT:-4317}:4317"
    depends_on:
      - tempo
    deploy:
      resources:
        limits:
          memory: 192M
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.7.0
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    user: root
    volumes:
      - ../observability/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3200/ready | grep -q ready"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 384M
    restart: unless-stopped

  loki:
    image: grafana/loki:3.3.2
    command: ["-config.file=/etc/loki/loki.yaml"]
    user: root
    volumes:
      - ../observability/loki.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3100/ready | grep -q ready"]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 384M
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.3.2
    command: ["-config.file=/etc/promtail/config.yaml"]
    volumes:
      - ../observability/promtail.yaml:/etc/promtail/config.yaml:ro
      # Read-only access to the Docker API for container discovery and log
      # streaming. Local development only — a real deployment would use the
      # node's log files or a sidecar, not the daemon socket.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      loki:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 192M
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=24h"
      # Required for exemplars: without this the exemplar storage is disabled
      # and the trace links on the latency panel silently do nothing.
      - "--enable-feature=exemplar-storage"
      - "--web.enable-lifecycle"
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:9090/-/healthy | grep -q Healthy"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 448M
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.1
    environment:
      # Anonymous admin access. This is a local demonstration stack with no
      # data worth protecting; requiring a login would add a click between
      # `make up` and a working dashboard, which is exactly what we are trying
      # to avoid. A real deployment would not do this.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_USERS_DEFAULT_THEME: "dark"
      GF_FEATURE_TOGGLES_ENABLE: "traceqlEditor"
      # Land straight on the dashboard rather than on an empty home page.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: "/var/lib/grafana/dashboards/webhook-relay.json"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3000/api/health | grep -q ok"]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 384M
    restart: unless-stopped

  # Controllable webhook receiver, for the Day 2 verification. It is a test
  # fixture, so it sits behind a profile and does not start with the stack.
  sink:
    build:
      context: ../..
      dockerfile: Dockerfile.sink
    profiles: ["demo"]
    ports:
      - "${SINK_PORT:-9090}:9090"
    restart: unless-stopped

  # Applies migrations, then exits. Kept behind a profile so `docker compose up`
  # does not run it implicitly; `make migrate-up` invokes it by name.
  #
  # Uses the official golang-migrate image rather than linking the library into
  # the app. Migrations are an operator action, not something a starting pod
  # should do — several replicas racing to migrate on rollout is a classic way
  # to deadlock a deploy.
  migrate:
    image: migrate/migrate:v4.18.1
    profiles: ["tools"]
    volumes:
      - ../../migrations:/migrations:ro
    entrypoint:
      [
        "migrate",
        "-path", "/migrations",
        "-database", "postgres://webhook_relay:webhook_relay@postgres:5432/webhook_relay?sslmode=disable",
      ]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  valkey_data:
  prometheus_data:
  tempo_data:
  loki_data:
  grafana_data:
