{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "webhook-relay.serviceAccountName" . }}
  labels:
    {{- include "webhook-relay.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Neither workload talks to the Kubernetes API, so mounting a token would hand
# every pod a credential it has no use for — and that an attacker who achieved
# RCE would immediately look for.
automountServiceAccountToken: false
{{- end }}
