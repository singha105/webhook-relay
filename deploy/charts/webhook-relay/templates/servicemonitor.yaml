{{- if .Values.serviceMonitor.enabled }}
{{/*
  ServiceMonitors, one per workload.

  Prometheus discovers these itself, so adding a replica or rolling the
  deployment needs no scrape-config change. The Terraform sets
  serviceMonitorSelectorNilUsesHelmValues=false on the operator, without which
  it would only pick up monitors carrying its own release label and these would
  be silently ignored — the most common reason app metrics never appear.
*/}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "webhook-relay.fullname" . }}-api
  labels:
    {{- include "webhook-relay.componentLabels" (dict "root" . "component" "api") | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "webhook-relay.componentSelectorLabels" (dict "root" . "component" "api") | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
      # The pod name lands on every series as a label, so a scrape gap can be
      # traced to a specific replica rather than to "the api".
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "webhook-relay.fullname" . }}-worker
  labels:
    {{- include "webhook-relay.componentLabels" (dict "root" . "component" "worker") | nindent 4 }}
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "webhook-relay.componentSelectorLabels" (dict "root" . "component" "worker") | nindent 6 }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
{{- end }}
