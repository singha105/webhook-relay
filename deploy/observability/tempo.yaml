# Tempo, single-binary mode with local storage.
#
# Deliberately minimal: no object store, no compactor tuning, 24h retention.
# This is a demonstration stack that must fit alongside Postgres, Valkey and
# Grafana on a laptop, and traces older than a day answer no question anyone is
# asking here.

server:
  http_listen_port: 3200
  grpc_listen_port: 9096
  log_level: warn

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317

ingester:
  # Short flush windows so a trace is queryable seconds after it is emitted.
  # Production would use far longer windows; here, waiting five minutes to see
  # the trace you just created makes the tool useless for the demo.
  max_block_duration: 5m
  complete_block_timeout: 30s

compactor:
  compaction:
    block_retention: 24h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

usage_report:
  reporting_enabled: false
