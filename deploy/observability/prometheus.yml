# Prometheus scrape configuration.
#
# 15s is a deliberate choice, not a default. The SLO is measured in seconds of
# backlog age, and a 60s interval would let a two-minute backlog appear as a
# single sample. Faster than 15s buys resolution nobody looks at and multiplies
# storage for a demo stack.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: local
    env: dev

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: webhook-relay-api
    static_configs:
      - targets: ["api:8080"]
        labels:
          component: api

  - job_name: webhook-relay-worker
    static_configs:
      - targets: ["worker:9100"]
        labels:
          component: worker

  # Scraping itself: if this job is missing, nothing else on the dashboard can
  # be trusted either.
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
